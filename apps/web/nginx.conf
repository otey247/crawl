# Link-preview crawlers get server-rendered Open Graph pages; people get the SPA.
map $http_user_agent $is_preview_bot {
  default 0;
  ~*(facebookexternalhit|facebot|twitterbot|slackbot|discordbot|whatsapp|telegrambot|linkedinbot|applebot|skypeuripreview|redditbot|embedly|pinterest|googlebot|bingbot) 1;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  location /v1/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;
  }
  location /socket.io/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location ~ ^/(i/[A-Za-z0-9_-]+|crawls/[0-9a-fA-F-]{36})$ {
    if ($is_preview_bot) {
      rewrite ^/(.*)$ /v1/og/$1 break;
      proxy_pass http://api:4000;
    }
    try_files $uri /index.html;
  }
  location / {
    try_files $uri /index.html;
  }
}
