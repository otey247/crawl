# Full stack: docker compose up --build  →  http://localhost:8080
# Seed dev data once: docker compose run --rm api node dist/db/seed.js
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: crawl
      POSTGRES_PASSWORD: crawl
      POSTGRES_DB: crawl
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crawl']
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment: &api-env
      DATABASE_URL: postgres://crawl:crawl@db:5432/crawl
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      APP_URL: ${APP_URL:-http://localhost:8080}
      API_URL: ${API_URL:-http://localhost:8080}
      CORS_ORIGINS: ${APP_URL:-http://localhost:8080}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VALHALLA_URL: ${VALHALLA_URL:-}
      INLINE_WORKERS: 'false'
      DEV_LOGIN: ${DEV_LOGIN:-true}
      NODE_ENV: ${NODE_ENV:-development}
    volumes: [storage:/app/apps/api/storage]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
  worker:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ['node', 'dist/worker.js']
    environment: *api-env
    volumes: [storage:/app/apps/api/storage]
    depends_on: [api]
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ['8080:80']
    depends_on: [api]
  # Optional self-hosted walking router for Missouri:
  #   docker compose --profile routing up -d valhalla, then set VALHALLA_URL=http://valhalla:8002
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    profiles: [routing]
    environment:
      tile_urls: https://download.geofabrik.de/north-america/us/missouri-latest.osm.pbf
    volumes: [valhalla:/custom_files]
    ports: ['8002:8002']
volumes:
  pgdata:
  storage:
  valhalla:
